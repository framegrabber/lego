[project]
name = "lego"
version = "0.1.0"
description = "Claude-driven LEGO design: DSL → LDraw, verification, rendering, instructions"
readme = "README.md"
authors = [
    { name = "Felix Rothballer", email = "felix.rothballer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.63.0",
]

[project.scripts]
lego = "lego.cli:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = ["ldraw: needs the LDraw parts library (skipped if missing)"]
